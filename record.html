<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>新增手沖紀錄 - CoffeeNote</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <a href="dashboard.html" class="title-link"><h1>☕ CoffeeNote</h1></a>
    <span class="identity" id="identity-label"></span>
  </div>

  <div class="page">
    <div class="page-heading">
      <a href="dashboard.html" class="icon-btn back-btn" aria-label="回上一頁">←</a>
      <h2 id="page-title">新增手沖紀錄</h2>
    </div>
    <div id="msg-area"></div>

    <form id="record-form">
      <div class="card">
        <h2 style="margin-top:0;">1. 咖啡豆資訊</h2>
        <label for="bean-select">選擇豆子</label>
        <select id="bean-select">
          <option value="">尚未選擇</option>
        </select>
        <p class="hint" id="bean-meta"></p>
        <p class="hint">豆子沒有列出來？<a href="beans.html">去新增咖啡豆</a></p>
      </div>

      <div class="card">
        <h2 style="margin-top:0;">2. 沖煮參數</h2>

        <div class="field-row">
          <div>
            <label for="water-temp">水溫 (°C)</label>
            <div class="stepper" data-decimals="1">
              <button type="button" class="stepper-btn" data-delta="-0.5">－</button>
              <input type="number" id="water-temp" class="stepper-input" step="0.5" min="0" max="100" inputmode="decimal" />
              <button type="button" class="stepper-btn" data-delta="0.5">＋</button>
            </div>
          </div>
          <div>
            <label for="dose-weight">粉重 (g)</label>
            <select id="dose-weight"></select>
          </div>
        </div>

        <label for="grind-size">研磨刻度</label>
        <div class="stepper" data-decimals="1">
          <button type="button" class="stepper-btn" data-delta="-0.5">－</button>
          <input type="number" id="grind-size" class="stepper-input" step="0.5" min="0" max="20" inputmode="decimal" />
          <button type="button" class="stepper-btn" data-delta="0.5">＋</button>
        </div>

        <label for="water-weight">注水量 (g)</label>
        <div class="stepper stepper-dual" data-decimals="0">
          <button type="button" class="stepper-btn" data-delta="-5">－5</button>
          <button type="button" class="stepper-btn" data-delta="-1">－1</button>
          <input type="number" id="water-weight" class="stepper-input" step="1" min="0" max="2000" inputmode="numeric" />
          <button type="button" class="stepper-btn" data-delta="1">＋1</button>
          <button type="button" class="stepper-btn" data-delta="5">＋5</button>
        </div>

        <label>沖煮總時間（分:秒）</label>
        <div class="time-row">
          <div class="stepper" data-decimals="0">
            <button type="button" class="stepper-btn" data-delta="-1">－</button>
            <input type="number" id="brew-minutes" class="stepper-input" step="1" min="0" max="59" inputmode="numeric" />
            <button type="button" class="stepper-btn" data-delta="1">＋</button>
          </div>
          <span class="time-colon">:</span>
          <div class="stepper" data-decimals="0">
            <button type="button" class="stepper-btn" data-delta="-5">－</button>
            <input type="number" id="brew-seconds" class="stepper-input" step="5" min="0" max="59" inputmode="numeric" />
            <button type="button" class="stepper-btn" data-delta="5">＋</button>
          </div>
        </div>
      </div>

      <h2>3. 沖煮結果</h2>
      <div class="card">
        <div class="key-metrics">
          <label for="concentration-input">濃度 (%) <span style="color:var(--fail)">*必填</span></label>
          <div class="stepper" data-decimals="2">
            <button type="button" class="stepper-btn" data-delta="-0.01">－</button>
            <input type="number" id="concentration-input" class="stepper-input" step="0.01" min="0" max="5" required inputmode="decimal" />
            <button type="button" class="stepper-btn" data-delta="0.01">＋</button>
          </div>
          <div class="metric-row">
            <span id="concentration-badge" class="badge neutral">尚未輸入</span>
            <span class="hint" id="concentration-hint"></span>
          </div>

          <label for="liquid-input" style="margin-top:16px;">液體量 (g) <span style="color:var(--fail)">*必填</span></label>
          <div class="stepper stepper-dual" data-decimals="0">
            <button type="button" class="stepper-btn" data-delta="-5">－5</button>
            <button type="button" class="stepper-btn" data-delta="-1">－1</button>
            <input type="number" id="liquid-input" class="stepper-input" step="1" min="0" max="2000" required inputmode="numeric" />
            <button type="button" class="stepper-btn" data-delta="1">＋1</button>
            <button type="button" class="stepper-btn" data-delta="5">＋5</button>
          </div>
          <div class="metric-row">
            <span id="liquid-badge" class="badge neutral">尚未輸入</span>
            <span class="hint" id="liquid-hint"></span>
          </div>

          <div class="metric-row" style="margin-top:14px; border-top:1px solid var(--border); padding-top:12px;">
            <strong>整體判定</strong>
            <span id="overall-badge" class="badge neutral">—</span>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 style="margin-top:0;">4. 備註</h2>
        <label for="notes">風味 / 心得（選填）</label>
        <textarea id="notes" placeholder="口感、酸甜苦、下次調整方向..."></textarea>
      </div>

      <div class="sticky-footer">
        <button type="submit" class="btn" id="submit-btn">送出紀錄</button>
      </div>
    </form>
  </div>

  <script type="module" src="js/page-record.js"></script>
</body>
</html>
