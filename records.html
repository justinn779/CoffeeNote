<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>查看紀錄 - CoffeeNote</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4b3621" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CoffeeNote" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" />
</head>
<body>
  <div class="topbar">
    <a href="dashboard.html" class="title-link"><h1>☕ CoffeeNote</h1></a>
    <span class="identity" id="identity-label"></span>
  </div>

  <div class="page">
    <div class="page-heading">
      <a href="dashboard.html" class="icon-btn back-btn" aria-label="回上一頁">←</a>
      <h2>手沖紀錄</h2>
      <button type="button" class="icon-btn refresh-btn" id="refresh-btn" aria-label="重新整理">↻</button>
    </div>

    <div class="filter-bar">
      <select id="filter-bean">
        <option value="">全部豆子</option>
      </select>
      <select id="filter-group">
        <option value="">全部組別</option>
      </select>
      <label class="checkbox-row">
        <input type="checkbox" id="filter-mine" />
        只看我的紀錄
      </label>
    </div>

    <div id="list-area">
      <p class="empty-state">載入中...</p>
    </div>
  </div>

  <script type="module" src="js/page-records.js"></script>
</body>
</html>
