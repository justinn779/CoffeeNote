<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoffeeNote 主選單</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <a href="dashboard.html" class="title-link"><h1>☕ CoffeeNote</h1></a>
    <div>
      <span class="identity" id="identity-label"></span>
      <a href="#" class="logout" id="logout-link">切換身份</a>
    </div>
  </div>

  <div class="page">
    <div class="btn-grid-square">
      <a class="btn-square" href="record.html">
        <span class="btn-square-icon">📝</span>
        <span class="btn-square-label">新增手沖紀錄</span>
      </a>
      <a class="btn-square btn-square-secondary" href="records.html">
        <span class="btn-square-icon">📋</span>
        <span class="btn-square-label">查看紀錄</span>
      </a>
    </div>

    <p class="footer-link"><a href="beans.html">☕ 管理咖啡豆清單</a></p>
  </div>

  <button type="button" class="icon-btn qr-btn" id="qr-btn" aria-label="顯示 QR Code">▦</button>

  <div class="modal-backdrop" id="qr-modal" hidden>
    <div class="modal-card">
      <button type="button" class="icon-btn modal-close" id="qr-close" aria-label="關閉">×</button>
      <h2 style="margin-top:0;">掃描加入 CoffeeNote</h2>
      <img id="qr-image" class="qr-image" alt="CoffeeNote 網址 QR Code" width="220" height="220" />
      <p class="hint" id="qr-url"></p>
    </div>
  </div>

  <script type="module" src="js/page-dashboard.js"></script>
</body>
</html>
