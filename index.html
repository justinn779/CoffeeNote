<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoffeeNote 手沖咖啡紀錄</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <button type="button" class="icon-btn qr-btn" id="qr-btn" aria-label="顯示 QR Code">▦</button>

  <div class="page">
    <h1 class="hero-title">☕ CoffeeNote</h1>
    <p class="hero-sub">手沖咖啡紀錄本 — 選擇你的組別，輸入名稱開始</p>

    <div class="card">
      <label>選擇組別</label>
      <div class="group-grid" id="group-grid"></div>

      <label for="name-input">輸入名稱（綽號）</label>
      <input type="text" id="name-input" placeholder="例如：小明 / 阿凱" maxlength="20" />

      <div style="margin-top: 20px;">
        <button class="btn" id="start-btn" disabled>開始使用</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="qr-modal" hidden>
    <div class="modal-card">
      <button type="button" class="icon-btn modal-close" id="qr-close" aria-label="關閉">×</button>
      <h2 style="margin-top:0;">掃描加入 CoffeeNote</h2>
      <img id="qr-image" class="qr-image" alt="CoffeeNote 網址 QR Code" width="220" height="220" />
      <p class="hint" id="qr-url"></p>
    </div>
  </div>

  <script type="module" src="js/page-index.js"></script>
</body>
</html>
